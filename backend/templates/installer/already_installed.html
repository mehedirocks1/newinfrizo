<!DOCTYPE html>
<html>
<head>
    <title>Already Installed</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f8f9fa; }
        .card { max-width: 440px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; margin: 8px; }
        .btn-admin { background: #7928ca; color: white; }
        .btn-reset { background: #ea0606; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>NewInfrizo is Installed</h2>
        <p>Your system has already been configured.</p>
        <div style="margin-top: 20px;">
            <a href="/admin/" class="btn btn-admin">Go to Admin Dashboard</a>
            <button onclick="resetSetup()" class="btn btn-reset">Reset & Re-run Installer</button>
        </div>
    </div>

    <script>
    async function resetSetup() {
        if (confirm('Are you sure you want to reset setup? You will be able to re-enter your admin password.')) {
            const res = await fetch('/install/api/reset/', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                window.location.reload();
            }
        }
    }
    </script>
</body>
</html>
